# Evita che il progetto Supabase gratuito vada in pausa per inattività.
# Servono due "secrets" nel repository: SUPABASE_URL e SUPABASE_ANON_KEY.
name: keepalive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/services?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
